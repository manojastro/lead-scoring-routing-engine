# File: docker-compose.yml
# Local stack: MLflow tracking server + registry backend, then the scoring API.
# Secrets come from the git-ignored .env file (environment only).

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LOG_LEVEL: INFO
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  mlflow-data:
